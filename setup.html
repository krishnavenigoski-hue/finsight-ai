<!DOCTYPE html>
<html>

<head>

<title>FinSight AI - Setup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🤖 Welcome to FinSight AI</h1>

<p>Create your personal financial profile</p>

</header>



<section>


<h2>👤 Personal Details</h2>


<input id="userName" type="text" placeholder="Enter your name">


</section>





<section>


<h2>💰 Income Details</h2>


<input id="salary" type="number" placeholder="Enter monthly salary">


<input id="otherIncome" type="number" placeholder="Other monthly income">


</section>






<section>


<h2>🏠 Monthly Commitments</h2>


<input id="rent" type="number" placeholder="House Rent">


<input id="emi" type="number" placeholder="EMI / Loans">


<input id="bills" type="number" placeholder="Bills">


</section>







<section>


<h2>💸 Monthly Spending</h2>


<input id="food" type="number" placeholder="Food Budget">


<input id="travel" type="number" placeholder="Travel Budget">


<input id="shopping" type="number" placeholder="Shopping Budget">


<input id="otherExpense" type="number" placeholder="Other Expenses">


</section>








<section>


<h2>🎯 Short-Term Goals</h2>

<input id="shortGoal1" type="text" placeholder="Short Goal 1">
<input id="shortAmount1" type="number" placeholder="Target Amount">

<input id="shortGoal2" type="text" placeholder="Short Goal 2">
<input id="shortAmount2" type="number" placeholder="Target Amount">

<input id="shortGoal3" type="text" placeholder="Short Goal 3">
<input id="shortAmount3" type="number" placeholder="Target Amount">

</section>







<section>


<h2>🏡 Long-Term Goals</h2>

<input id="longGoal1" type="text" placeholder="Long Goal 1">
<input id="longAmount1" type="number" placeholder="Target Amount">

<input id="longGoal2" type="text" placeholder="Long Goal 2">
<input id="longAmount2" type="number" placeholder="Target Amount">

<input id="longGoal3" type="text" placeholder="Long Goal 3">
<input id="longAmount3" type="number" placeholder="Target Amount">
</section>







<section>


<h2>🏦 Savings</h2>


<input id="currentSavings" type="number" placeholder="Current Savings">


<input id="savingTarget" type="number" placeholder="Monthly Saving Target">


</section>







<button type="button" onclick="saveProfile()">
🚀 Create My Financial Profile
  </button>







<script src="script.js"></script>


</body>

</html>
