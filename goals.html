<!DOCTYPE html>

<html>

<head>

<title>Financial Goals - FinSight AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎯 Financial Goals</h1>

<p id="goalWelcome">
Plan your dreams and track your progress
</p>

</header>







<section>

<h2>⚡ Short-Term Goals</h2>

<p>Goals you want to achieve in the near future</p>


<div class="dashboard" id="shortGoalsContainer">


</div>


</section>








<section>


<h2>🏆 Long-Term Goals</h2>

<p>Big dreams for your future</p>



<div class="dashboard" id="longGoalsContainer">


</div>


</section>









<section>


<h2>🤖 Goal AI Advisor</h2>


<div class="card">


<p id="goalAI">

Analysing your goals...

</p>


</div>


</section>








<button onclick="history.back()">

⬅ Back To Dashboard

</button>








<!-- AI CHAT -->


<div class="ai-button" onclick="openAIChat()">

🤖

</div>





<div class="ai-chat-box" id="aiChatBox">


<h3>
🤖 FinSight AI Assistant
</h3>


<div id="chatMessages">

<p>
🤖 Hi! Ask me about your finance.
</p>

</div>



<input id="aiInput" placeholder="Ask about your money">



<button onclick="sendMessage()">

Send

</button>



</div>








<script src="script.js"></script>



<script>


let profile =
JSON.parse(localStorage.getItem("finSightProfile"));




if(profile){



document.getElementById("goalWelcome").innerHTML =
"Welcome "+profile.name+" 👋 Track your financial dreams";





let shortContainer =
document.getElementById("shortGoalsContainer");



profile.shortGoals.forEach(function(goal){



shortContainer.innerHTML += `

<div class="card">

<h3>🎯 ${goal.goal}</h3>

<p>Target Amount: ₹${goal.amount}</p>

<p>Saved: ₹0</p>

<p>Progress: 0%</p>

</div>

`;

});







let longContainer =
document.getElementById("longGoalsContainer");



profile.longGoals.forEach(function(goal){



longContainer.innerHTML += `

<div class="card">

<h3>🏡 ${goal.goal}</h3>

<p>Target Amount: ₹${goal.amount}</p>

<p>Saved: ₹0</p>

<p>Progress: 0%</p>

</div>

`;

});






document.getElementById("goalAI").innerHTML =

"💡 Your AI recommends focusing on one goal at a time and maintaining regular savings towards your targets.";





}

else{


document.getElementById("goalAI").innerHTML =

"Please complete your financial profile first.";

}



</script>



</body>

</html>
