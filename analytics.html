<!DOCTYPE html>
<html>

<head>

<title>FinSight AI - Smart Analytics</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<header>

<h1>📊 Smart Analytics</h1>

<p>Understand your financial behaviour using AI data analysis</p>

</header>





<section>

<h2>📈 Financial Analytics</h2>


<div class="analytics-container">


<div class="chart-box">

<h3>📈 Monthly Spending Trend</h3>

<canvas id="monthlyChart"></canvas>

</div>




<div class="chart-box">

<h3>🥧 Expense Categories</h3>

<canvas id="categoryChart"></canvas>

</div>




<div class="chart-box full-chart">

<h3>📊 Last Month vs This Month</h3>

<canvas id="compareChart"></canvas>

</div>


</div>


</section>







<section>

<h2>💡 Financial Summary</h2>


<div class="dashboard">


<div class="card">

<h3>🏆 Best Category</h3>

<p>Education</p>

</div>




<div class="card">

<h3>💰 Savings Rate</h3>

<p>64%</p>

</div>




<div class="card">

<h3>💸 Monthly Expense</h3>

<p>₹18,000</p>

</div>



</div>


</section>






<button onclick="history.back()">

⬅ Back To Dashboard

</button>







<script>


// Monthly Spending Trend

new Chart(document.getElementById("monthlyChart"),{

type:"line",

data:{

labels:[
"Jan",
"Feb",
"Mar",
"Apr",
"May",
"Jun"
],

datasets:[{

label:"Spending (₹)",

data:[
12000,
15000,
13000,
18000,
16000,
20000
],

borderWidth:2

}]

},

options:{

responsive:true,

maintainAspectRatio:true

}

});








// Expense Category Chart

new Chart(document.getElementById("categoryChart"),{

type:"doughnut",

data:{

labels:[
"Food",
"Travel",
"Shopping",
"Education"
],

datasets:[{

data:[
5000,
3000,
6000,
4000
]

}]

},

options:{

responsive:true,

maintainAspectRatio:true

}

});









// Comparison Chart

new Chart(document.getElementById("compareChart"),{

type:"bar",

data:{

labels:[
"Food",
"Travel",
"Shopping",
"Education"
],

datasets:[

{

label:"Last Month",

data:[
4000,
2500,
3000,
2500
]

},


{

label:"This Month",

data:[
5000,
3000,
6000,
4000
]

}

]

},

options:{

responsive:true,

maintainAspectRatio:true

}

});



</script>



</body>

</html>
